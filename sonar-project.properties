sonar.projectKey=hononeko_kerrlab-homelab-launchpad
sonar.organization=hononeko
sonar.host.url=https://sonarcloud.io

sonar.sources=server,src,scripts
sonar.tests=server,src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,server/test/**,src/test/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,server/test/**,src/test/**

# LCOV reports from `bun run test:coverage` (server and client run separately)
sonar.javascript.lcov.reportPaths=coverage/server/lcov.info,coverage/client/lcov.info
# Entry points and the smoke test are exercised by the build and CI smoke test, not unit tests
sonar.coverage.exclusions=src/main.tsx,scripts/**
