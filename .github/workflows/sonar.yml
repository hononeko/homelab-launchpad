name: Sonar

# SonarCloud analysis with the coverage reports from validate.yml, so the tests run once. Shared by pr.yml and
# main.yml. Skipped until the SONAR_TOKEN secret exists.
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  sonar:
    name: Sonar Analysis
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download coverage reports
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage
          path: coverage

      - name: Run SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
