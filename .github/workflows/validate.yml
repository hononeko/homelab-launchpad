name: Validate

# Lint (workflows, Dockerfiles, oxlint, types), tests with coverage (incl. the Valkey store contract), production build
# and smoke test. Shared by pr.yml and main.yml.
on:
  workflow_call:

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Valkey for the preferences store contract tests (skipped without VALKEY_TEST_URL)
    services:
      valkey:
        image: valkey/valkey:9.2-alpine@sha256:cdcb7b1c7b6f1c9cb9442c71ac6275e78184657448407b2c1fdde7ee8024f4fb
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun and dependencies
        uses: hononeko/actions/bun-setup@v1

      - name: Lint workflows and actions
        uses: hononeko/actions/lint-actions@v1

      - name: Lint Dockerfiles
        uses: hononeko/actions/lint-docker@v1

      - name: Lint JS/TS
        uses: hononeko/actions/lint-js@v1

      - name: TypeScript typecheck
        run: bun run lint

      - name: Unit tests with coverage thresholds
        run: bun run test:coverage
        env:
          VALKEY_TEST_URL: redis://localhost:6379

      # Overall coverage is reported; a pull request's changed lines must be 80% covered. bunfig.toml keeps per-file
      # floors on top.
      - name: Coverage
        uses: hononeko/actions/coverage@v1
        with:
          files: coverage/server/lcov.info coverage/client/lcov.info
          min-changed-coverage: "80"

      - name: Build frontend and server
        run: bun run build

      - name: Production server smoke test
        run: bun run test:smoke
